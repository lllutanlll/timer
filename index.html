<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Timer</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=M+PLUS+Rounded+1c:wght@700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  background:#A8C9D2;
  font-family:'M PLUS Rounded 1c', sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  color:white;
  overflow:hidden;
}

.timer{
  text-align:center;
  position:relative;
}

#task{
  font-size:28px;
  font-weight:700;
  margin-bottom:20px;
  letter-spacing:.04em;
  text-shadow:0 2px 8px rgba(0,0,0,.08);
}

#time{
  font-family:'Press Start 2P', cursive;
  font-size:56px;
  letter-spacing:2px;
  line-height:1.4;
  text-shadow:0 2px 12px rgba(0,0,0,.08);
}

#status{
  margin-top:18px;
  font-size:13px;
  opacity:.75;
  letter-spacing:.08em;
}

#reset{
  position:fixed;
  right:16px;
  bottom:16px;
  border:none;
  background:rgba(255,255,255,.15);
  color:white;
  width:32px;
  height:32px;
  border-radius:999px;
  font-size:14px;
  cursor:pointer;
  backdrop-filter:blur(4px);
  transition:.2s;
}

#reset:hover{
  background:rgba(255,255,255,.25);
}

#pip{
  position:fixed;
  right:56px;
  bottom:16px;
  border:none;
  background:rgba(255,255,255,.15);
  color:white;
  width:32px;
  height:32px;
  padding:0;
  border-radius:999px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  backdrop-filter:blur(4px);
  transition:.2s;
}

#pip:hover{
  background:rgba(255,255,255,.25);
}
</style>
</head>
<body>

<div id="wrap">
  <div class="timer" id="timerBox">

    <div id="task">作業なし</div>

    <div id="time">00:00:00</div>

    <div id="status">待機中</div>

  </div>
</div>

<button id="reset" title="リセット（合計を0にする）">↺</button>
<button id="pip" title="小さな窓で常に手前に表示" aria-label="小さな窓で常に手前に表示"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><rect x="12" y="12" width="7" height="5" rx="1" fill="currentColor" stroke="none"/></svg></button>

<script>
const API_URL = "https://notiontimer.vercel.app/api/status";
const API_KEY = "mjynhdbtjc57";

const timeEl = document.getElementById("time");
const statusEl = document.getElementById("status");
const taskEl = document.getElementById("task");
const resetBtn = document.getElementById("reset");
const pipBtn = document.getElementById("pip");
const wrapEl = document.getElementById("wrap");
const timerBox = document.getElementById("timerBox");

// 表示する時間は「最後にリセットしてからの合計」。
// 合計はサーバー（作業記録DB）から受け取り、画面側は表示だけを進める。
// 同期のたびにサーバー値で上書きされるので、
// 再読み込み・再起動・端末変更・日またぎでも合計は消えない。
let running = false;
let hasTotal = false;
let baseElapsedMs = 0;   // サーバーから受け取った合計
let baseAt = Date.now(); // それを受け取った時刻
// 表示が後戻りしないためのガード:
// Notionの時刻は分単位なので、サーバーの合計が表示より小さく戻ることがある。
// 同じリセット区間の中では、表示した最大値より小さくしない。
let maxShownMs = 0;
let guardResetAt = undefined;

function format(ms){

  const total = Math.floor(ms / 1000);

  const h = String(Math.floor(total / 3600)).padStart(2,"0");
  const m = String(Math.floor((total % 3600) / 60)).padStart(2,"0");
  const s = String(total % 60).padStart(2,"0");

  return `${h}:${m}:${s}`;
}

function currentElapsedMs(){
  if(running){
    return baseElapsedMs + (Date.now() - baseAt);
  }
  return baseElapsedMs;
}

function render(){
  timeEl.textContent = format(currentElapsedMs());
}

setInterval(render, 250);

resetBtn.addEventListener("click", async () => {

  // 合計を 0 にする唯一の操作。
  // サーバー側（作業記録DB）にリセットの記録を残してから 0 にする。
  // 記録できない場合は表示を変えない（変えると次の同期で戻ってしまうため）。
  try{
    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "x-api-key": API_KEY,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ action: "reset" })
    });

    const data = await response.json();

    if(!response.ok || !data.ok){
      statusEl.textContent = "リセットを記録できませんでした";
      return;
    }

    baseElapsedMs = 0;
    baseAt = Date.now();
    hasTotal = false;
    maxShownMs = 0;
    guardResetAt = undefined;
    taskEl.textContent = "作業なし";
    statusEl.textContent = "待機中";
    render();
    checkNotion();

  }catch(e){
    console.log(e);
    statusEl.textContent = "リセットを記録できませんでした";
  }
});

// ---- 小窓（ピクチャインピクチャ） ----
// Chrome / Edge の Document Picture-in-Picture で、
// タイマーだけを常に手前に出る小さな窓に移す。
// 対応していない場合は、小さな別ウィンドウでタイマーを開く
// （サーバーと同期するので、そちらにも同じ合計が出る）。
pipBtn.addEventListener("click", async () => {

  if("documentPictureInPicture" in window){
    try{
      const pipWindow = await window.documentPictureInPicture.requestWindow({
        width: 360,
        height: 210
      });

      // フォントとスタイルを小窓側にも入れる（元のタイマーと同じフォント）
      const fontLink = pipWindow.document.createElement("link");
      fontLink.rel = "stylesheet";
      fontLink.href = "https://fonts.googleapis.com/css2?family=Press+Start+2P&family=M+PLUS+Rounded+1c:wght@700&display=swap";
      pipWindow.document.head.appendChild(fontLink);

      const style = pipWindow.document.createElement("style");
      style.textContent = document.querySelector("style").textContent +
        "\n#task{font-size:20px;margin-bottom:10px;}" +
        "\n#time{font-size:36px;}" +
        "\n#status{margin-top:10px;}";
      pipWindow.document.head.appendChild(style);

      pipWindow.document.body.appendChild(timerBox);

      pipWindow.addEventListener("pagehide", () => {
        wrapEl.appendChild(timerBox);
      });

      return;
    }catch(e){
      console.log(e);
    }
  }

  window.open(API_URL.replace("/api/status", "/"), "_blank", "width=360,height=220,menubar=no,toolbar=no,location=no");
});

async function checkNotion(){

  try{

    const response = await fetch(API_URL, {
      headers: {
        "x-api-key": API_KEY
      }
    });

    const data = await response.json();

    if(typeof data.elapsedSeconds === "number"){
      // リセット区間が変わったらガードを解除する
      if(data.resetAt !== guardResetAt){
        guardResetAt = data.resetAt;
        maxShownMs = 0;
      }
      const serverMs = data.elapsedSeconds * 1000;
      if(serverMs > maxShownMs) maxShownMs = serverMs;
      baseElapsedMs = maxShownMs;
      baseAt = Date.now();
      hasTotal = data.elapsedSeconds > 0 || maxShownMs > 0;
    }

    running = !!data.running;

    if(data.task){
      taskEl.textContent = data.task;
    }else if(!hasTotal){
      taskEl.textContent = "作業なし";
    }

    if(data.running){
      statusEl.textContent = "作業中";
    }else if(data.stopped || hasTotal){
      statusEl.textContent = "一時停止中";
    }else{
      statusEl.textContent = "待機中";
    }

    render();

  }catch(e){

    console.log(e);

    statusEl.textContent = "接続エラー";
  }
}

checkNotion();

setInterval(checkNotion,5000);
</script>

</body>
</html>
